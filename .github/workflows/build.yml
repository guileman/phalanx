name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk phalanx-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phalanx-apk
          path: phalanx-${{ github.run_number }}.apk

      - name: Publicar release (para descargar desde el celular)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Phalanx build ${{ github.run_number }}
          prerelease: true
          files: phalanx-${{ github.run_number }}.apk
